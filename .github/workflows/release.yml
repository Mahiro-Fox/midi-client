name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    env:
      # 本机没有 MSVC，项目固定在 windows-gnu 工具链上；
      # scripts/run.mjs 会把这个目录前置进 PATH 供 cargo 找链接器。
      MIDITOOL_MINGW: 'C:\msys64\ucrt64\bin'
      # 构建产物不弹任何交互框
      CI: true

    steps:
      - uses: actions/checkout@v4

      # 提供 x86_64-w64-mingw32-gcc / -ar（rust windows-gnu 目标的链接器）
      - name: Setup MSYS2 mingw
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc
          path-type: inherit

      # 提前失败：工具链缺东西时不要等到 cargo link 阶段才报错
      - name: Verify mingw linker
        shell: pwsh
        run: |
          $bin = $env:MIDITOOL_MINGW
          $cc = Join-Path $bin 'x86_64-w64-mingw32-gcc.exe'
          if (-not (Test-Path $cc)) {
            $cc = Join-Path $bin 'gcc.exe'
            if (-not (Test-Path $cc)) { throw "缺少 gcc：$bin" }
            Write-Host "注意：没有三元组前缀的 gcc，run.mjs 会用 CARGO_TARGET_*_LINKER 覆盖"
          }
          & $cc --version
          $ar = Join-Path $bin 'x86_64-w64-mingw32-ar.exe'
          if (Test-Path $ar) { & $ar --version | Select-Object -First 1 }
          else { Write-Host "注意：没有三元组 ar，run.mjs 会退回 ar.exe" }

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          targets: x86_64-pc-windows-gnu

      - name: Verify rust toolchain
        shell: pwsh
        run: |
          rustc -vV
          cargo -V

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # tag 与 tauri.conf.json 版本不一致会导致发布的 latest.json 指向错误版本
      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $tag = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($tag -ne $conf.version) {
            throw "tag v$tag 与 tauri.conf.json 的 $($conf.version) 不一致，先跑 npm run bump <version>"
          }
          Write-Host "版本一致：$($conf.version)"

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "MIDITOOL v__VERSION__"
          releaseBody: |
            自动构建发布。安装包与 `latest.json` 已附带签名，客户端可直接在线更新。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
