name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# 本机与 CI 都走 MSVC：runner 自带 VS Build Tools，本地是 rustup 默认的
# stable-x86_64-pc-windows-msvc，构建链只有这一条。
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      # tag 与 tauri.conf.json 版本不一致会让 latest.json 指向错误的安装包
      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $tag = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($tag -ne $conf.version) {
            throw "tag v$tag 与 tauri.conf.json 的 $($conf.version) 不一致，先跑 npm run bump <version>"
          }
          Write-Host "版本一致：$($conf.version)"

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "midi-client v__VERSION__"
          releaseBody: "下载下方的 `midi-client_*_x64-setup.exe` 安装即可，已安装的旧版本会自动更新到该版本。"
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
